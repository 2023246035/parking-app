version: '3.8'

# API-Only Docker Compose with External Aiven PostgreSQL
# No local PostgreSQL - uses Aiven cloud database

services:
  # FastAPI Backend only
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: parkmycar-api
    restart: unless-stopped
    environment:
      # Database connection from .env (Aiven PostgreSQL)
      DATABASE_URL: ${DATABASE_URL}
      
      # AWS SES Configuration
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SES_SENDER_EMAIL: ${SES_SENDER_EMAIL:-noreply@parkmycar.com}
      
      # Email Settings
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      GMAIL_SENDER_EMAIL: ${GMAIL_SENDER_EMAIL}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      
      # API Settings
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-please-change-this-secret-key}
      
      # Frontend URL for CORS
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploaded_files:/app/uploaded_files
      # Live reload: mount source code for development
      - ./app:/app/app
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload --log-level info

volumes:
  uploaded_files:
    driver: local
