version: '3.8'

# API-Only Docker Compose Configuration
# This runs only the FastAPI backend without the Reflex frontend

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: parkmycar-api-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parkmycar}
      POSTGRES_USER: ${POSTGRES_USER:-parkmycar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_api_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parkmycar_user} -d ${POSTGRES_DB:-parkmycar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api-network

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: parkmycar-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database connection
      DATABASE_URL: postgresql://${POSTGRES_USER:-parkmycar_user}:${POSTGRES_PASSWORD:-changeme123}@postgres:5432/${POSTGRES_DB:-parkmycar}
      
      # AWS SES Configuration
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SES_SENDER_EMAIL: ${SES_SENDER_EMAIL:-noreply@parkmycar.com}
      
      # Email Settings
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      
      # API Settings
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-please-change-this-secret-key}
      
      # Frontend URL for CORS
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploaded_files:/app/uploaded_files
      # For development: uncomment to mount source code
      # - ./app:/app/app
    networks:
      - api-network
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --log-level info

  # Redis (Optional - for caching and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: parkmycar-api-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - api-network
    profiles:
      - cache
    command: redis-server --appendonly yes

  # Nginx API Gateway (Optional)
  nginx-api:
    image: nginx:alpine
    container_name: parkmycar-api-gateway
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/api-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - api-network
    profiles:
      - gateway

volumes:
  postgres_api_data:
    driver: local
  uploaded_files:
    driver: local
  redis_data:
    driver: local

networks:
  api-network:
    driver: bridge
