version: '3.8'

services:
  # 1. Frontend UI (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Update this to your public backend URL in production
        - API_URL=http://localhost:8000
    container_name: parkmycar-frontend
    ports:
      - "3000:80"
    restart: always
    depends_on:
      - backend

  # 2. Core Backend (Reflex Python + FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: parkmycar-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
    env_file:
      - .env
    restart: always

  # 3. AI Microservice (Standalone decoupled capabilities)
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: parkmycar-ai-service
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=production
    env_file:
      - .env
    restart: always
